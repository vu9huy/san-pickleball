name: Build and Deploy

on:
  push:
    branches:
      - main   # or main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Build and push Docker images ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-client:latest ./pickleball-client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-client:latest

      - name: Build and push server image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-server:latest ./pickleball-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-server:latest

      # --- Copy docker-compose.yml to server ---
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USER }}/san-pickleball/"

      # --- Ensure nginx directory exists ---
      - name: Create nginx directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/san-pickleball/nginx

      # --- Copy nginx/default.conf to server ---
      - name: Upload Nginx config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/default.conf"
          target: "/home/${{ secrets.SSH_USER }}/san-pickleball/nginx/"
          strip_components: 1

      # --- Deploy on server ---
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/san-pickleball
            docker compose pull
            docker compose up -d
