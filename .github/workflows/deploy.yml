name: Build and Deploy with SSL

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Build and push Docker images ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-client:latest ./pickleball-client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-client:latest

      - name: Build and push server image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-server:latest ./pickleball-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-server:latest

      # --- Copy configuration files to server ---
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USER }}/san-pickleball/"

      - name: Create nginx directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/san-pickleball/nginx
            mkdir -p /home/${{ secrets.SSH_USER }}/san-pickleball/scripts

      - name: Upload Nginx config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/default.conf"
          target: "/home/${{ secrets.SSH_USER }}/san-pickleball/"
          overwrite: true

      - name: Upload SSL renewal script
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/ssl-renew.sh"
          target: "/home/${{ secrets.SSH_USER }}/san-pickleball/"
          overwrite: true

      # --- Deploy and setup SSL ---
      - name: Deploy to Server with SSL Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/san-pickleball
            
            # Make scripts executable
            chmod +x scripts/ssl-renew.sh
            
            # Pull latest images
            docker compose pull
            
            # Check if certificates already exist
            if [ ! -d "/home/${{ secrets.SSH_USER }}/san-pickleball/certbot-etc/live/sanpickleball.xyz" ]; then
              echo "Setting up SSL certificates for the first time..."
              
              # Start with HTTP-only nginx temporarily for certificate generation
              docker compose up -d nginx client server mongo
              sleep 10
              
              # Generate SSL certificates
              docker compose run --rm certbot
              
              # Check if certificates were created successfully
              if [ -d "/home/${{ secrets.SSH_USER }}/san-pickleball/certbot-etc/live/sanpickleball.xyz" ]; then
                echo "SSL certificates generated successfully"
              else
                echo "Failed to generate SSL certificates"
                exit 1
              fi
            fi
            
            # Start all services (nginx will now use SSL config)
            docker compose up -d
            
            # Setup certificate auto-renewal cron job
            (crontab -l 2>/dev/null; echo "0 12 * * * /home/${{ secrets.SSH_USER }}/san-pickleball/scripts/ssl-renew.sh >> /var/log/le-renew.log 2>&1") | crontab -
            
            # Verify deployment
            docker compose ps