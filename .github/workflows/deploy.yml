deploy:
  runs-on: ubuntu-latest
  needs: [build-client, build-server]
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "docker-compose.yml,nginx/default.conf,nginx/www"
        target: "/home/${{ secrets.SSH_USER }}/san-pickleball/"
        strip_components: 0

    - name: Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/${{ secrets.SSH_USER }}/san-pickleball

          # Ensure webroot exists
          mkdir -p ./nginx/www

          # Stop any old containers and remove orphans
          docker compose down --remove-orphans

          # Pull latest images & start all containers
          docker compose pull
          docker compose up -d

          # Clean up unused images
          docker image prune -f
