name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  # -------------------------
  # Build & Push Images
  # -------------------------
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [client, server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./pickleball-${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pickleball-${{ matrix.service }}:latest
          # cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pickleball-${{ matrix.service }}:buildcache
          # cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pickleball-${{ matrix.service }}:buildcache,mode=max

  # -------------------------
  # Deploy to Server
  # -------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "/home/${{ secrets.SSH_USER }}/san-pickleball/"
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/san-pickleball

            # Ensure webroot exists
            mkdir -p ./nginx/www

            # Stop any old containers and remove orphans
            docker compose down --remove-orphans

            # Pull latest images & start all containers
            docker compose pull
            docker compose up -d

            # Clean up unused images
            docker image prune -f

