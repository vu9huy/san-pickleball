services:
  client:
    image: gaaravu0/pickleball-client:latest
    container_name: nextjs-client
    restart: always
    ports:
      - "8080:8080"

  server:
    image: gaaravu0/pickleball-server:latest
    container_name: node-server
    restart: always
    ports:
      - "2704:2704"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: mongo-db
    restart: always
    ports:
      - "27017:27017"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt        # <--- shared with certbot
      - certbot-var:/var/lib/letsencrypt    # <--- shared with certbot
      - ./nginx/www:/var/www/certbot        # <--- webroot for certbot
    depends_on:
      - client
      - server

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  mongo-data:
  certbot-etc:
  certbot-var:
