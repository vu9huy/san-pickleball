services:
  client:
    image: gaaravu0/pickleball-client:latest
    container_name: nextjs-client
    restart: always
    ports:
      - "8080:8080"

  server:
    image: gaaravu0/pickleball-server:latest
    container_name: node-server
    restart: always
    ports:
      - "2704:2704"
    environment:
      - MONGODB_URI=mongodb://sanpickleball:sanpickleball@mongo:27017/sanpickleball?authSource=sanpickleball
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: mongo-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: quanvu
      MONGO_INITDB_ROOT_PASSWORD: quanvu
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt        # <--- shared with certbot
      - certbot-var:/var/lib/letsencrypt    # <--- shared with certbot
      - ./nginx/www:/var/www/certbot        # <--- webroot for certbot
    depends_on:
      - client
      - server

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  mongo-data:
  certbot-etc:
  certbot-var:
