      - GOOGLE_OAUTH_CLIENT_SECRET = "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"
      - GOOGLE_OAUTH_REFRESH_TOKEN = "1//04WuSDOvejFMcCgYIARAAGAQSNwF-L9Irkro9Ta-1OuonMyf1GhNnMS4-eQSOWvezYv2DEdMPo2f5uKPAi1NsL6ls_s3Z13BzEAY"

      - EMAIL_ADDRESS = "sanpickleball@gmail.com"
      - EMAIL_PASSWORD = "quan27041998vu"

      - GOOGLE_ANALYTICS_PROPERTY_ID = "465695350"
      
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: mongo-db
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt        # <--- shared with certbot
      - certbot-var:/var/lib/letsencrypt    # <--- shared with certbot
      - ./nginx/www:/var/www/certbot        # <--- webroot for certbot
    depends_on:
      - client
      - server

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  mongo-data:
  certbot-etc:
  certbot-var:
