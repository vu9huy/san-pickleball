version: "3.8"
services:
  client:
    build: ./pickleball-client
    container_name: nextjs-client
    restart: always
    ports:
      - "8080:8080"

  server:
    build: ./pickleball-server
    container_name: node-server
    restart: always
    ports:
      - "2704:2704"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: mongo-db
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "1234:1234"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server

volumes:
  mongo-data:
